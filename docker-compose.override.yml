# docker-compose.override.yml
# =========================================================
# Override DESARROLLO LOCAL (se fusiona con docker-compose.yml).
# Producción: docker compose -f docker-compose.yml up
# =========================================================

services:
  backend:
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app.main:app --host 0.0.0.0 --port $${UVICORN_PORT:-8000} --reload",
      ]
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
      ENVIRONMENT: "development"
      # Dev local: crea/asigna admin al arrancar si .env tiene SEED_ADMIN_EMAIL + PASSWORD + TELEFONO
      SEED_ADMIN_ON_START: "true"
