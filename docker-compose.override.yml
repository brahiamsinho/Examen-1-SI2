# docker-compose.override.yml
# =========================================================
# Override DESARROLLO LOCAL (se fusiona con docker-compose.yml).
# Producción / CI sin hot-reload: docker compose -f docker-compose.yml up -d
#
# Nota Windows: bind mount ./backend:/app en OneDrive suele ir lento (--reload + sync).
# Si el arranque o el reload se sienten pesados, cloná el repo fuera de OneDrive o usá
# solo docker-compose.yml (sin este override) cuando no edites Python en caliente.
# =========================================================

services:
  backend:
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app.main:app --host 0.0.0.0 --port $${UVICORN_PORT:-8000} --reload",
      ]
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
      ENVIRONMENT: "development"
      RUN_MIGRATIONS_ON_START: "true"
      RUN_SEEDS_IN_LIFESPAN: "false"
      # Dev local: migraciones + seeds idempotentes vía entrypoint antes de uvicorn.
      SEED_ADMIN_ON_START: "true"
      SEED_CLIENTE_ON_START: "true"
      SEED_TALLER_ON_START: "true"
      SEED_TECNICO_ON_START: "true"
