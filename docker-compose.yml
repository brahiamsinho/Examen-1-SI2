# docker-compose.yml
# =========================================================
# Stack: PostgreSQL, FastAPI backend, Angular frontend, Mailhog.
#
# Copy .env.example to .env in the repo root; Compose loads ./.env automatically.
# =========================================================

services:

  db:
    image: postgres:15-alpine
    container_name: emergencias_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/migrations/0002_ciclo2_fase1_emergencias.sql:/docker-entrypoint-initdb.d/02_ciclo2_fase1_emergencias.sql:ro
      - ./backend/migrations/0003_ciclo2_fase2_seguimiento.sql:/docker-entrypoint-initdb.d/03_ciclo2_fase2_seguimiento.sql:ro
      - ./backend/migrations/0004_ciclo2_fase3_comunicaciones.sql:/docker-entrypoint-initdb.d/04_ciclo2_fase3_comunicaciones.sql:ro
      - ./backend/migrations/0005_ciclo2_fase4_pagos.sql:/docker-entrypoint-initdb.d/05_ciclo2_fase4_pagos.sql:ro
      - ./backend/migrations/0006_tecnico_asignado_at.sql:/docker-entrypoint-initdb.d/06_tecnico_asignado_at.sql:ro
      - ./backend/migrations/0007_taller_operacion_permisos.sql:/docker-entrypoint-initdb.d/07_taller_operacion_permisos.sql:ro
      - ./backend/migrations/0008_taller_bandeja_disponibilidad.sql:/docker-entrypoint-initdb.d/08_taller_bandeja_disponibilidad.sql:ro
      - ./backend/migrations/0009_taller_asignacion_tecnico.sql:/docker-entrypoint-initdb.d/09_taller_asignacion_tecnico.sql:ro
      - ./backend/migrations/0010_taller_comisiones.sql:/docker-entrypoint-initdb.d/10_taller_comisiones.sql:ro
      - ./backend/migrations/0012_ia_modulo.sql:/docker-entrypoint-initdb.d/12_ia_modulo.sql:ro
      - ./backend/migrations/0011_usuario_tokens_seguridad.sql:/docker-entrypoint-initdb.d/11_usuario_tokens_seguridad.sql:ro
      - ./backend/migrations/0013_tecnico_ubicacion_compartida.sql:/docker-entrypoint-initdb.d/13_tecnico_ubicacion_compartida.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - emergencias_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: emergencias_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - emergencias_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: emergencias_backend
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app.main:app --host 0.0.0.0 --port $${UVICORN_PORT:-8000}",
      ]
    environment:
      # Puerto 5432 es el del contenedor Postgres en la red Docker (no POSTGRES_PORT del host).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:80}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      API_PREFIX: ${API_PREFIX:-/api}
      UVICORN_PORT: ${UVICORN_PORT:-8000}
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-false}
      # Defaults = .env.example (dev). En prod: define SEED_ADMIN_* en .env o deja SEED_ADMIN_ON_START=false y usa `python -m app.seeds`.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@emergenciasviales.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-cambiar_password_dev}
      SEED_ADMIN_TELEFONO: ${SEED_ADMIN_TELEFONO:-+573000000001}
      SEED_ADMIN_NOMBRES: ${SEED_ADMIN_NOMBRES:-Administrador}
      SEED_ADMIN_APELLIDOS: ${SEED_ADMIN_APELLIDOS:-Sistema}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_CLIENTE_ON_START: ${SEED_CLIENTE_ON_START:-false}
      SEED_CLIENTE_EMAIL: ${SEED_CLIENTE_EMAIL:-cliente@emergenciasviales.com}
      SEED_CLIENTE_PASSWORD: ${SEED_CLIENTE_PASSWORD:-cambiar_password_dev}
      SEED_CLIENTE_TELEFONO: ${SEED_CLIENTE_TELEFONO:-+573000000002}
      SEED_CLIENTE_NOMBRES: ${SEED_CLIENTE_NOMBRES:-Cliente}
      SEED_CLIENTE_APELLIDOS: ${SEED_CLIENTE_APELLIDOS:-Demo}
      SEED_CLIENTE_CIUDAD: ${SEED_CLIENTE_CIUDAD:-La Paz}
      SEED_CLIENTE_DIRECCION: ${SEED_CLIENTE_DIRECCION:-Calle Demo 1}
      SEED_TALLER_ON_START: ${SEED_TALLER_ON_START:-false}
      SEED_TALLER_EMAIL: ${SEED_TALLER_EMAIL:-taller@emergenciasviales.com}
      SEED_TALLER_PASSWORD: ${SEED_TALLER_PASSWORD:-cambiar_password_dev}
      SEED_TALLER_TELEFONO: ${SEED_TALLER_TELEFONO:-+573000000003}
      SEED_TALLER_RESPONSABLE_NOMBRES: ${SEED_TALLER_RESPONSABLE_NOMBRES:-Responsable}
      SEED_TALLER_RESPONSABLE_APELLIDOS: ${SEED_TALLER_RESPONSABLE_APELLIDOS:-Taller Demo}
      SEED_TALLER_NOMBRE_COMERCIAL: ${SEED_TALLER_NOMBRE_COMERCIAL:-Taller Demo Emergencias}
      SEED_TALLER_CIUDAD: ${SEED_TALLER_CIUDAD:-La Paz}
      SEED_TALLER_DIRECCION: ${SEED_TALLER_DIRECCION:-Av. Seed 100}
      SEED_TALLER_DESCRIPCION: ${SEED_TALLER_DESCRIPCION:-Taller de demostracion (seed)}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/app/firebase-credentials.json}
      PAGO_SIMULADO_AUTOCOMPLETE: ${PAGO_SIMULADO_AUTOCOMPLETE:-true}
      PAGO_PROVEEDOR_DEFAULT: ${PAGO_PROVEEDOR_DEFAULT:-SIMULADO}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_STRICT: ${EMAIL_STRICT:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@emergenciasviales.local}
      EMAIL_LINK_BASE_URL: ${EMAIL_LINK_BASE_URL:-http://localhost:8000}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_INFERENCE_BASE_URL: ${AI_INFERENCE_BASE_URL:-}
      AI_INFERENCE_TIMEOUT_S: ${AI_INFERENCE_TIMEOUT_S:-120}
      AI_INFERENCE_STUB: ${AI_INFERENCE_STUB:-false}
      AI_MAX_AUDIO_BYTES: ${AI_MAX_AUDIO_BYTES:-15728640}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-12582912}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${UVICORN_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - emergencias_net
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request as u;p=os.environ.get('UVICORN_PORT','8000');u.urlopen('http://127.0.0.1:'+p+'/health',timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backend/firebase-credentials.json:/app/firebase-credentials.json:ro


  ai-inference:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: services/ai-inference/Dockerfile
    container_name: emergencias_ai_inference
    restart: unless-stopped
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      YOLO_ENABLED: ${YOLO_ENABLED:-true}
      YOLO_TASK: ${YOLO_TASK:-detect}
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      YOLO_CONF: ${YOLO_CONF:-0.35}
      YOLO_IMGSZ: ${YOLO_IMGSZ:-640}
    volumes:
      - ai_inference_cache:/root/.cache
    networks:
      - emergencias_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emergencias_frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8000}
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - emergencias_net


volumes:
  postgres_data:
    name: emergencias_postgres_data
  ai_inference_cache:
    name: emergencias_ai_inference_cache


networks:
  emergencias_net:
    name: emergencias_network
    driver: bridge
