# nginx.conf — Configuración nginx para Angular SPA
# =========================================================
# CRÍTICO: El bloque "try_files" es lo que permite que Angular Router
# funcione. Sin él, rutas como /usuarios darían 404 en nginx.
# =========================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    source_charset utf-8;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        # Si el archivo existe, sírvelo; si no, redirige a index.html
        # Esto es lo que hace funcionar el routing de Angular en producción
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos (JS, CSS, fuentes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy hacia el backend (evita CORS en producción)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
