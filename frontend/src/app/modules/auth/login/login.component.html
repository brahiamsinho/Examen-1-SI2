<div class="login-container">
  <div class="login-card">
    <h1 class="login-brand">
      <span class="login-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M5 11l1.5-4.5h11L19 11m-14 0h14v4H5v-4zm2.5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span>Emergencias Vehiculares</span>
    </h1>
    <h2>Iniciar sesión</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          autocomplete="email"
        />
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          placeholder="Escribe tu contraseña"
          autocomplete="current-password"
        />
      </div>
      <div class="error" *ngIf="error">{{ error }}</div>
      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
