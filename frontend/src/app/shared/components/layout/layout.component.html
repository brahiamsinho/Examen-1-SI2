<div class="layout-root">
  <aside class="sidebar-desktop">
    <div class="sidebar-inner">
      <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
    </div>
  </aside>

  <div class="mobile-overlay" *ngIf="mobileOpen()">
    <button type="button" class="mobile-backdrop" (click)="closeMobile()" aria-label="Cerrar menú"></button>
    <div class="mobile-drawer">
      <div class="sidebar-inner">
        <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
      </div>
    </div>
  </div>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="menu-toggle" (click)="openMobile()" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div>
          <p class="topbar-title">{{ pageTitle() }}</p>
          <p class="topbar-sub">Plataforma de Emergencias Vehiculares</p>
        </div>
      </div>
      <div class="topbar-right">
        <button type="button" class="icon-btn" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="notify-dot"></span>
        </button>
        <button type="button" class="user-chip" routerLink="/dashboard">
          <span class="avatar">{{ userInitials() }}</span>
          <span class="user-name">{{ userDisplayName() }}</span>
        </button>
      </div>
    </header>
    <main class="page-main">
      <router-outlet />
    </main>
  </div>
</div>

<ng-template #sidebarContent>
  <div class="sidebar-brand">
    <div class="brand-row">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>
      </div>
      <div>
        <p class="brand-title">EmergenciasViales</p>
        <p class="brand-sub">Panel Administrador</p>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Principal">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
      class="nav-btn"
      (click)="closeMobile()"
    >
      <ng-container [ngSwitch]="item.icon">
        <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <svg *ngSwitchCase="'shield'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <svg *ngSwitchCase="'key'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
        <svg *ngSwitchCase="'wrench'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <svg *ngSwitchCase="'clipboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        </svg>
        <svg *ngSwitchCase="'car'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-.4-3.2-.8c-.6-.1-1.1.2-1.5.5L8 12v4h.02"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>
        </svg>
      </ng-container>
      <span>{{ item.label }}</span>
      <svg *ngIf="isNavActive(item)" class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/dashboard" class="nav-btn" (click)="closeMobile()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Mi perfil</span>
    </a>
    <button type="button" class="nav-btn danger" (click)="onLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</ng-template>
