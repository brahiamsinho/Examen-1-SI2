<div class="page">
  <header class="page__head">
    <h1>Notificaciones</h1>
    <p class="page__sub">Avisos de emergencias y cambios de estado en tiempo casi real.</p>
  </header>

  <div class="page__filters">
    <button type="button" class="chip" [class.chip--active]="!soloNoLeidas" (click)="toggleFiltro(false)">
      Todas
    </button>
    <button type="button" class="chip" [class.chip--active]="soloNoLeidas" (click)="toggleFiltro(true)">
      No leídas
    </button>
    <button type="button" class="chip chip--ghost" (click)="reload()" [disabled]="loading">Actualizar</button>
  </div>

  <p *ngIf="error" class="page__error">{{ error }}</p>
  <p *ngIf="loading" class="page__loading">Cargando…</p>

  <ul *ngIf="!loading && items.length" class="list">
    <li *ngFor="let n of items" class="list__item" [class.list__item--unread]="!n.leida">
      <button type="button" class="list__btn" (click)="abrir(n)">
        <span class="list__row">
          <span class="list__title">{{ n.titulo }}</span>
          <span class="list__tipo">{{ tipoLabel(n.tipo) }}</span>
        </span>
        <span class="list__msg">{{ n.mensaje }}</span>
        <span class="list__meta">{{ n.created_at | date: 'short' }}</span>
      </button>
    </li>
  </ul>

  <div *ngIf="!loading && !items.length" class="empty">
    <p>{{ soloNoLeidas ? 'No hay notificaciones sin leer.' : 'Todavía no hay notificaciones.' }}</p>
  </div>
</div>
