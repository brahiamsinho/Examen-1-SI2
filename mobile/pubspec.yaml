name: mobile_emergencias
description: Plataforma Inteligente de Atención de Emergencias Vehiculares - App Móvil
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client con soporte de interceptores
  dio: ^5.4.0
  
  # Almacenamiento seguro para tokens JWT
  flutter_secure_storage: ^9.0.0
  
  # Navegación declarativa
  go_router: ^17.2.1
  
  # Iconos
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.1
  shadcn_ui: ^0.53.6
  shared_preferences: ^2.5.5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
